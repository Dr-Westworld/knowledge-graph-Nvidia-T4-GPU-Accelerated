name: repository-quality

on:
  push:
  pull_request:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate notebook/source parity
        run: python scripts/validate_repo.py
      - name: Compile extracted sources
        run: python -m py_compile kg_pipeline.py scripts/test_vllm_server.py
