[project]
name = "gpu-knowledge-graph-pipeline"
version = "1.0.0"
description = "GPU-aware PDF-to-knowledge-graph pipeline with isolated vLLM extraction, validation, resolution, and graph analytics."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
    { name = "Om Gawade", email = "gawade1420@gmail.com" }
]

urls = {
    "Homepage" = "https://github.com/Dr-Westworld",
    "Repository" = "https://github.com/Dr-Westworld/gpu-knowledge-graph-pipeline",
    "Issues" = "https://github.com/Dr-Westworld/gpu-knowledge-graph-pipeline/issues"
}

# The CUDA/RAPIDS/vLLM runtime is intentionally installed by the notebook;
# keeping it out of the default metadata prevents a CPU/Windows install from
# pretending to be a complete GPU environment.
dependencies = [
    "flask",
    "pyvis",
    "networkx",
    "pypdf>=5.0.0",
    "python-docx>=0.8.11",
    "chardet>=5.2.0"
]

[tool.setuptools]
package-dir = {"" = "src"}
